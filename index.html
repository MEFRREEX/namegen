<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glow-background"></div>

    <div class="container">
        <h1>Name Generator</h1>

        <div class="form-group">
            <label>Starting Sequence (Optional)</label>
            <input type="text" id="startSequence" placeholder="e.g. Me, Str, Al" autocomplete="off">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Min Length</label>
                <input type="number" id="minLength" value="5" min="1">
            </div>
            <div class="form-group">
                <label>Max Length</label>
                <input type="number" id="maxLength" value="10" min="1">
            </div>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="count" value="10" min="1">
        </div>

        <div class="form-group">
            <label>Case Mode</label>
            <div class="dropdown" id="caseModeDropdown">
                <div class="dropdown-trigger">
                    <span class="dropdown-selected" id="dropdownSelected">Lower</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                    </svg>
                </div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="dropdown-item" data-value="lowercase">
                        <span class="dropdown-item-label">Lower</span>
                        <span class="dropdown-item-desc">All lower case</span>
                    </div>
                    <div class="dropdown-item" data-value="capitalize">
                        <span class="dropdown-item-label">Capitalize</span>
                        <span class="dropdown-item-desc">First letter upper case</span>
                    </div>
                    <div class="dropdown-item" data-value="preserve">
                        <span class="dropdown-item-label">Preserve</span>
                        <span class="dropdown-item-desc">From starting sequence</span>
                    </div>
                </div>
                <input type="hidden" id="caseMode" value="lowercase">
            </div>
        </div>

        <div class="generate-row">
            <button id="generateBtn">Generate</button>
            <button id="resetBtn" class="reset-btn" title="Reset settings">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
        </div>

        <div id="results" class="results-container"></div>

        <div class="bookmarks-section">
            <div class="bookmarks-header" onclick="toggleBookmarks()">
                <span>Saved Bookmarks (<span id="bookmarkCount">0</span>)</span>
                <span id="chevron">▼</span>
            </div>
            <div id="bookmarksList"></div>
            <button id="clearAllBookmarksBtn" class="clear-all-btn" title="Delete all bookmarks">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path fill="currentColor" d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12z"/>
                </svg>
                Delete All Bookmarks
            </button>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-body">
                <h3 class="modal-title">Delete All Bookmarks</h3>
                <p class="modal-desc">This action cannot be undone. All saved bookmarks will be permanently removed.</p>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Delete All</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
